<!DOCTYPE html>
<html>

<head>
    <title>Div and Span</title>
</head>

<body>

    <h1>HTML Div and Span</h1>

    <!-- DIV -->

    <div>
        <h2>Student Information</h2>

        <p>Name: Raju</p>
        <p>Course: Computer Engineering</p>
        <p>City: Latur</p>
    </div>


    <hr>


    <!-- Another DIV -->

    <div>
        <h2>My Skills</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </div>


    <hr>


    <!-- SPAN -->

    <p>
        I am learning
        <span>HTML</span>
        and
        <span>CSS</span>.
    </p>


    <!-- Multiple Span -->

    <p>
        My name is
        <span>Raju</span>
        and I am a
        <span>Computer Engineering Student</span>.
    </p>

</body>

</html>
