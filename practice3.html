<!DOCTYPE html>
<html>

<head>
    <title>Headings and Paragraphs</title>
</head>

<body>

    <!-- Headings -->

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>


    <!-- Paragraph -->

    <p>This is a paragraph.</p>


    <!-- Text Formatting -->

    <b>Bold Text</b>
    <br>

    <strong>Important Text</strong>
    <br>

    <i>Italic Text</i>
    <br>

    <em>Emphasized Text</em>
    <br>
    <hr>

    <u>Underlined Text</u>
    <br>

    <mark>Highlighted Text</mark>
    <br>
    <hr>

    <small>Small Text</small>
    <br>

    <del>Deleted Text</del>
    <br>

    H<sub>2</sub>O
    <br>

    X<sup>2</sup>

</body>

</html>
