<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML Global Attributes</title>

</head>

<body>

    <h1 id="main-title" class="heading">
        HTML Global Attributes
    </h1>


    <!-- title attribute -->

    <p title="This is a tooltip">
        Move your mouse over this text.
    </p>


    <!-- hidden attribute -->

    <p hidden>
        This text is hidden.
    </p>


    <!-- contenteditable attribute -->

    <p contenteditable="true">
        You can edit this text.
    </p>


    <!-- draggable attribute -->

    <div draggable="true">
        Drag this box.
    </div>


    <br>


    <!-- spellcheck attribute -->

    <p contenteditable="true" spellcheck="true">
        Edit this text and check spelling.
    </p>


    <!-- tabindex attribute -->

    <button tabindex="1">
        First Button
    </button>

    <button tabindex="2">
        Second Button
    </button>


    <br><br>


    <!-- data-* custom attribute -->

    <div
        id="student"
        class="student-card"
        data-name="Raju"
        data-course="Computer Engineering">

        <h2>Student Information</h2>

        <p>Name: Raju</p>
        <p>Course: Computer Engineering</p>

    </div>


    <br>


    <!-- dir attribute -->

    <p dir="rtl">
        This text direction is right to left.
    </p>


    <!-- lang attribute -->

    <p lang="mr">
        हा मराठी भाषेतील मजकूर आहे.
    </p>

</body>

</html>
