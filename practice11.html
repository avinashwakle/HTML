<!DOCTYPE html>
<html>

<head>
    <title>HTML Classes and IDs</title>
</head>

<body>

    <h1 id="main-title">HTML Classes and IDs</h1>

    <!-- ID Example -->

    <p id="intro">
        This is an introduction paragraph.
    </p>


    <!-- Class Example -->

    <h2 class="heading">My Skills</h2>

    <p class="text">HTML</p>
    <p class="text">CSS</p>
    <p class="text">JavaScript</p>


    <!-- Multiple Classes -->

    <p class="text important">
        This paragraph has two classes.
    </p>


    <!-- Same ID should not normally be repeated -->

    <div id="student-info">

        <h2>Student Information</h2>

        <p class="info">Name: Raju</p>
        <p class="info">Course: Computer Engineering</p>
        <p class="info">City: Latur</p>

    </div>


    <!-- Class can be reused -->

    <div class="box">
        <h3>Box 1</h3>
        <p>This is the first box.</p>
    </div>

    <div class="box">
        <h3>Box 2</h3>
        <p>This is the second box.</p>
    </div>

</body>

</html>
