<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HTML Form Validation</title>

</head>

<body>

    <h1>Registration Form</h1>

    <form>

        <!-- Name -->
        <label for="name">Full Name:</label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
            minlength="3"
            maxlength="30">

        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>

        <br><br>


        <!-- Password -->
        <label for="password">Password:</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
            minlength="6">

        <br><br>


        <!-- Age -->
        <label for="age">Age:</label>

        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required>

        <br><br>


        <!-- Phone -->
        <label for="phone">Phone:</label>

        <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            placeholder="10 digit number"
            required>

        <br><br>


        <!-- Date -->
        <label for="dob">Date of Birth:</label>

        <input
            type="date"
            id="dob"
            name="dob"
            required>

        <br><br>


        <!-- Gender -->
        <label>Gender:</label>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required>

        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female">

        <label for="female">Female</label>

        <br><br>


        <!-- Terms -->
        <input
            type="checkbox"
            id="terms"
            name="terms"
            required>

        <label for="terms">
            I agree to the terms and conditions
        </label>

        <br><br>


        <!-- Submit -->
        <button type="submit">
            Register
        </button>

        <button type="reset">
            Reset
        </button>

    </form>

</body>

</html>
